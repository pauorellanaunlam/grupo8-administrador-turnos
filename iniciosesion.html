<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesion</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header-inicio">
        <h1>Bienvenido a medicos online</h1>
    </header>
    <main class="main">
        <section class="login-section">
            <h3 >Iniciar sesión</h3>
            <div class="acceso-rapido">
                <span>Acceso rápido</span>
                <div>
                    <a href="usuario.html" class="button-simple">Usuario</a>
                    <a href="admin.html" class="button-simple">Administrador</a>
                </div>
            </div>

            <form class="formulario-inicio" action="usuario.html" method="get">
                <div class="formulario-items">
                    <label for="username">Correo electrónico:</label>
                    <input class="input-form" type="email" id="username" name="username" placeholder="Ingrese correo electrónico" required>
                </div>
                <div class="formulario-items">
                    <label for="password">Contraseña:</label>
                    <input class="input-form" placeholder="Ingrese contraseña" type="password" id="password" name="password" required>
                </div>

                <button class="button-iniciar" type="submit">Iniciar sesión</button>
            </form>


            <div>
                <a class="button-recuperar">Olvidé mi contraseña</a>
            </div>

        </section>
    </main>

</body>

</html>
