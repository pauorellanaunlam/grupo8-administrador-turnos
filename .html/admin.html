<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Turnos Médicos</title>
    <link rel="stylesheet" href="../.css/styles.css">

</head>
<body>
    <header class="header-principal">
        <div class="logo-container">
            <a href="admin.html" class="logo-link"><img src="../.img/logo.png" alt="Logo" class="logo-img"></a>
        </div>
 
        <nav class="header-principal-nav">
            <a href="usuario.html">Vista Usuario</a>
            <a href="miperfil.html">Mi cuenta</a>
            <a href="../index.html">Cerrar sesión</a>
            <button type="button" class="button-tema-pagina" id="boton-tema">
                🌙
            </button>
        </nav>

    </header>
 
    <main class="pagina-admin">
 
        <h1 class="admin-titulo">Panel de administración</h1>
 
        <section class="admin-seccion">
            <h2 class="admin-subtitulo">Nuevo turno</h2>
 
            <form id="form-crear-turno" class="admin-form" novalidate>

                <div class="admin-campo">
                    <label for="profesional" class="admin-label">Profesional (*)</label>
                    <input type="text" id="profesional" class="admin-input"
                           placeholder="Ej: Dra. María González">
                    <span class="admin-error" id="error-profesional"></span>
                </div>

                <div class="admin-campo">
                    <label for="especialidad" class="admin-label">Especialidad (*)</label>
                    <select id="especialidad" class="admin-input">
                        <option value="">Elegí una especialidad</option>
                        <option value="clinica">Clínica médica</option>
                        <option value="cardiologia">Cardiología</option>
                        <option value="dermatologia">Dermatología</option>
                    </select>
                    <span class="admin-error" id="error-especialidad"></span>
                </div>

                <div class="admin-campo">
                    <label for="fecha" class="admin-label">Fecha (*)</label>
                    <input type="date" id="fecha" class="admin-input">
                    <span class="admin-error" id="error-fecha"></span>
                </div>

                <div class="admin-campo">
                    <label for="hora" class="admin-label">Horario (*)</label>
                    <input type="time" id="hora" class="admin-input">
                    <span class="admin-error" id="error-hora"></span>
                </div>

                <div class="admin-campo">
                    <label for="sede" class="admin-label">Sede (*)</label>
                    <select id="sede" class="admin-input">
                        <option value="">Elegí una sede</option>
                        <option value="sede1">Sede Lugano</option>
                        <option value="sede2">Sede Ramos Mejía</option>
                        <option value="sede3">Sede San Isidro</option>
                        <option value="virtual">Consulta virtual</option>
                    </select>
                    <span class="admin-error" id="error-sede"></span>
                </div>

                <div class="admin-campo">
                    <label for="comentario" class="admin-label">Consultorio o indicaciones (opcional)</label>
                    <input type="text" id="comentario" class="admin-input"
                           placeholder="Ej: Consultorio 3">
                </div>

                <button type="submit" class="admin-boton-publicar">Publicar turno</button>
            </form>
        </section>
 
        <section class="admin-seccion">
            <h2 class="admin-subtitulo">Turnos publicados</h2>
            <div class="lista-turnos-admin" id="lista-publicados"></div>
        </section>
 
        <section class="admin-seccion">
            <h2 class="admin-subtitulo">Turnos reservados</h2>
            <div class="lista-turnos-admin" id="lista-reservados"></div>
        </section>

        <section class="admin-seccion">
            <h2 class="admin-subtitulo">Turnos cancelados</h2>
            <div class="lista-turnos-admin" id="lista-cancelados"></div>
        </section>
 
    </main>
    <script src="../.js/script.js" defer></script>
    <script src="../.js/admin.js" defer></script>
 
</body>
</html>
