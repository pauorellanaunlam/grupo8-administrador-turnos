
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Turnos Médicos</title>
    <link rel="stylesheet" href="../.css/styles.css">
</head>
<body>

    <header class="header-admin">
        <h1>Turnos Médicos</h1>

        <nav>
            <a href="usuario.html">Vista usuario</a>
            <a href="../index.html">Cerrar sesión</a>
            <button type="button" class="button-tema-pagina">
                Claro / Oscuro
            </button>
        </nav>
    </header>

    <main class="pagina-admin">

        <section class="crear-turno">
            <h2>Nuevo turno</h2>

            <form id="form-crear-turno">

                <label for="profesional">Profesional</label>
                <input type="text" id="profesional"
                       placeholder="Nombre del médico" required>

                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad"
                       placeholder="Ej: Cardiología" required>

                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>

                <label for="hora">Horario</label>
                <input type="time" id="hora" required>

                <label for="consultorio">Consultorio</label>
                <input type="text" id="consultorio"
                       placeholder="Ej: 3" required>

                <button type="button">Publicar turno</button>
            </form>
        </section>

        <section class="turnos">
            <h2>Turnos publicados</h2>

            <div class="lista-turnos">

                <article class="card-turno">
                    <h3>Clínica médica</h3>
                    <p>Dra. María González</p>
                    <p>25/10/2026 · 09:30 hs</p>
                    <p>Consultorio 1</p>
                    <button type="button">Eliminar</button>
                </article>

                <article class="card-turno">
                    <h3>Cardiología</h3>
                    <p>Dr. Carlos Ramírez</p>
                    <p>28/10/2026 · 11:00 hs</p>
                    <p>Consultorio 3</p>
                    <button type="button">Eliminar</button>
                </article>

                <article class="card-turno">
                    <h3>Dermatología</h3>
                    <p>Dra. Laura Medina</p>
                    <p>03/11/2026 · 14:30 hs</p>
                    <p>Consultorio 2</p>
                    <button type="button">Eliminar</button>
                </article>

            </div>
        </section>

    </main>
</body>
</html>
