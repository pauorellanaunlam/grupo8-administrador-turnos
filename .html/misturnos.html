<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Turnos - Turnos Salud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../.css/styles.css">
</head>

<body>

    <header class="header-principal">
        <div class="logo-container">
            <a href="usuario.html" class="logo-link"><img src="../.img/logo.png" alt="Logo" class="logo-img"></a>
        </div>

        <nav class="header-principal-nav">
            <a href="admin.html">Vista Administrador</a>
            <a href="miperfil.html">Mi perfil</a>
            <a href="../index.html">Cerrar sesión</a>
            <a href="solicitarturnos.html" class="button-reservar-turno">
                Reservar turno
            </a>
            <button type="button" class="button-tema-pagina" id="boton-tema">
                🌙
            </button>
        </nav>
    </header>

    <main class="pagina-mis-turnos">

        <section class="mis-turnos-header">
            <div>
                <span class="etiqueta-seccion">ESPACIO PERSONAL</span>
                <h2>Mi agenda médica</h2>
                <p id="saludo-mis-turnos">Hola, María. Estos son tus próximos compromisos de salud.</p>
            </div>

            <a href="usuario.html" class="btn-nuevo-turno">
                <span>+</span> Agendar consulta
            </a>
        </section>

        <section class="destacado-contenedor" id="turno-destacado">
            <!-- JavaScript genera la próxima consulta -->
        </section>

        <section class="agenda-turnos">
            <div class="agenda-titulo">
                <div>
                    <span class="etiqueta-seccion" id="agenda-mes"></span>
                    <h2>Tu agenda</h2>
                    <p>Otras consultas que tenés programadas.</p>
                </div>

                <span class="agenda-total" id="agenda-total"></span>
            </div>

            <div class="agenda-listado" id="agenda-listado">
                <!-- JavaScript genera la agenda -->
            </div>
        </section>

        <section class="historial-turnos">
            <div class="historial-cabecera">
                <div>
                    <span class="etiqueta-seccion">REGISTRO PERSONAL</span>
                    <h2>Actividad reciente</h2>
                </div>

                <span class="historial-total" id="historial-total"></span>
            </div>

            <div class="historial-listado" id="historial-listado">
                <!-- JavaScript genera el historial -->
            </div>
        </section>

    </main>

    <script src="../.js/script.js" defer></script>
    <script src="../.js/misturnos.js" defer></script>
</body>

</html>
