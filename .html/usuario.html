<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Turnos Salud</title>
    <link rel="stylesheet" href="../.css/styles.css">
</head>

<body class="pagina-inicio-usuario">

    <header class="header-principal">
        <div class="logo-container">
            <a href="usuario.html" class="logo-link"><img src="../.img/logo.png" alt="Logo" class="logo-img"></a>
        </div>

        <nav class="header-principal-nav">
            <a href="admin.html">Vista Administrador</a>
            <a href="miperfil.html">Mi cuenta</a>
            <a href="../index.html">Cerrar sesión</a>
            <a href="solicitarturnos.html" class="button-reservar-turno">
                Reservar turno
            </a>
            <button type="button" class="button-tema-pagina" id="boton-tema">
                🌙
            </button>
        </nav>
    </header>

    <main class="pagina-usuario">

        <div class="contenido-usuario">


            <section class="home-usuario bienvenida-usuario">

                <h2>Encontrá tu próximo turno</h2>

                <p>
                    Buscá el profesional que necesitás y consultá
                    sus próximos horarios disponibles.
                </p>

                <form class="formulario-busqueda">

                    <div class="campo-busqueda">
                        <label for="buscar-especialidad">¿Qué especialidad necesitás?</label>

                        <select id="buscar-especialidad">
                            <option value="">Todas las especialidades</option>
                            <option value="clinica">Clínica médica</option>
                            <option value="cardiologia">Cardiología</option>
                            <option value="dermatologia">Dermatología</option>
                        </select>
                    </div>

                    <button type="button" class="button-nuevo-turno" id="btn-buscar-turnos">
                        Buscar turnos
                    </button>

                </form>

                <div class="imagen-bienvenida">
                    <img src="../.img/doctora.png" alt="Doctora animada">
                </div>

            </section>

            <!-- PROFESIONALES -->

            <section class="home-usuario">

                <h2>Profesionales disponibles</h2>
                <p class="descripcion-profesionales">
                    Explorá nuestros profesionales de salud y encontrá
                    el turno que mejor se adapte a vos.
                </p>
                <div class="selector-vista">
                    <span>Vista:</span>
                    <button type="button" class="button-vista activo" data-vista="tarjetas">Tarjetas</button>
                    <button type="button" class="button-vista" data-vista="lista">Lista</button>
                </div>

                <div class="lista-turnos" id="lista-profesionales">
                </div>

            </section>

        </div>

    </main>
    <script src="../.js/usuario.js" defer></script>
    <script src="../.js/script.js" defer></script>
</body>

</html>
