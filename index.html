
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos Salud</title>
    <link rel="stylesheet" href=".css/styles.css">

</head>

<body class="pagina-login">

    <main class="main-login">

        <aside class="aside-left-img">
            <div class="img-container">
                <img src=".img/turnos-salud.png" alt="img-ppal" class="ppal-img">
            </div>

            <div class="text-container">
                <h1>Te damos la bienvenida a Turnos Salud</h1>
                <p>En esta plataforma podrás gestionar tus turnos de manera rápida y sencilla.</p>
            </div>
        </aside>

        <aside class="aside-right-form">
            <div class="logo-container">
                <img src=".img/logo.png" alt="Logo" class="logo-img">
            </div>

            <div class="acceso-rapido">
                <p>Acceso rápido</p>
                <div class="acceso-rapido-buttons">
                    <a href=".html/admin.html" class="btn-acceso-rapido" id="btn-acceso-rapido-admin">Administrador</a>
                    <a href=".html/usuario.html" class="btn-acceso-rapido" id="btn-acceso-rapido-user">Usuario</a>
                </div>
            </div>

            <div class="form-container">
                <form class="formulario-inicio"
                      action=".html/usuario.html">

                    <div class="formulario-items">
                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            class="input-form"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                    <div class="formulario-items">
                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            class="input-form"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresá tu contraseña"
                            required
                        >
                    </div>

                    <div>
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <label for="remember-me">Recordar usuario</label>
                    </div>


                    <button type="submit" class="button-iniciar">
                        Ingresar
                    </button>

                </form>

                <p><a href="">¿Olvidaste tu contraseña?</a></p>

            </div>

            <div class="footer-container">
                <p>Accede a tu cuenta para comenzar a disfrutar de todas las funcionalidades que ofrecemos.</p>
            </div>

        </aside>

    </main>
    <script src=".js/script.js" defer></script>

</body>
</html>
