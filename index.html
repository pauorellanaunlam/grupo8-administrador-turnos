
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Turnos Médicos</title>
    <link rel="stylesheet" href=".css/styles.css">
</head>

<body class="pagina-login">

    <header class="header-inicio">
        <h1>✚ Turnos Médicos</h1>
    </header>

    <main class="main">

        <section class="login-section">

            <div class="login-contenido">

                <h2>¡Bienvenido!</h2>
                <p class="login-subtitulo">
                    Tu salud, más cerca.
                </p>

                <form class="formulario-inicio"
                      action=".html/usuario.html">

                    <div class="formulario-items">
                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            class="input-form"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                    <div class="formulario-items">
                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            class="input-form"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresá tu contraseña"
                            required
                        >
                    </div>

                    <button type="submit" class="button-iniciar">
                        Ingresar
                    </button>

                </form>

                <div class="accesos-demo">
                    <p>Accesos de prueba</p>

                    <nav class="acceso-rapido">
                        <a href=".html/usuario.html" class="button-simple">
                            Usuario
                        </a>

                        <a href=".html/admin.html" class="button-simple">
                            Administrador
                        </a>
                    </nav>
                </div>

            </div>

            <div class="login-ilustracion">
                <img class="login-img"
                    src=".img/doctora.png"
                    alt="Ilustración de una doctora"
                >
            </div>

        </section>

    </main>

</body>
</html>
